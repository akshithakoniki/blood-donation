```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LifeFlow</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
        }

        .left-side {
            flex: 1;
            background:
                linear-gradient(rgba(139, 0, 0, 0.8),
                    rgba(139, 0, 0, 0.8)),
                url("https://images.unsplash.com/photo-1584515933487-779824d29309?w=1200");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px;
        }

        .left-content {
            max-width: 500px;
        }

        .left-content h1 {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .left-content p {
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .right-side {
            flex: 1;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .register-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .1);
        }

        .register-card h2 {
            color: #8B0000;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
        }

        .btn-register {
            width: 100%;
            background: #8B0000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #6e0000;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #8B0000;
            text-decoration: none;
            font-weight: bold;
        }

        .icon-box {
            position: relative;
        }

        .icon-box i {
            position: absolute;
            right: 15px;
            top: 14px;
            color: gray;
        }

        @media(max-width:992px) {
            body {
                flex-direction: column;
            }

            .left-side {
                min-height: 250px;
            }
        }
    </style>
</head>

<body>

    <!-- Left Section -->

    <div class="left-side">

        <div class="left-content">

            <h1>Join LifeFlow ❤️</h1>

            <p>
                Become a part of our blood donor community.
                Register today and help save lives by donating
                blood when someone needs it the most.
            </p>

        </div>

    </div>

    <!-- Right Section -->

    <div class="right-side">

        <div class="register-card">

            <h2>Create Account</h2>

            <form>

                <div class="mb-3 icon-box">
                    <input type="text"
                        class="form-control"
                        placeholder="Full Name">
                    <i class="bi bi-person"></i>
                </div>

                <div class="mb-3 icon-box">
                    <input type="email"
                        class="form-control"
                        placeholder="Email Address">
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="mb-3 icon-box">
                    <input type="tel"
                        class="form-control"
                        placeholder="Mobile Number">
                    <i class="bi bi-telephone"></i>
                </div>

                <div class="mb-3">
                    <select class="form-select">
                        <option selected>Select Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="mb-3 icon-box">
                    <input type="password"
                        class="form-control"
                        placeholder="Password">
                    <i class="bi bi-lock"></i>
                </div>

                <div class="mb-3 icon-box">
                    <input type="password"
                        class="form-control"
                        placeholder="Confirm Password">
                    <i class="bi bi-shield-lock"></i>
                </div>

                <button type="submit" class="btn-register">
                    Register Now
                </button>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="loginpage.html">Login</a>
            </div>

        </div>

    </div>

</body>

</html>
